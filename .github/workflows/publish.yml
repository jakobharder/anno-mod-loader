name: Create Release

on:
  push:
    tags:
      - "v11.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Build tagged source
        run: bazel build //cmd/xmltest:xmltest117 -c opt

      - name: Test
        run: bazel test //tests/xml/... -c opt --test_output=errors

      - name: Package and smoke test
        run: python release/package.py --binary bazel-bin/cmd/xmltest/xmltest117.exe

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/xmltest.zip dist/xmltest.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "XML test tools $GITHUB_REF_NAME (Anno 117 v3.0)" \
            --notes-file release/v11.1.md
