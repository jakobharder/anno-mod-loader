name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Build
        run: |
          bazel build //... -c opt

      - name: Test
        run: bazel test //tests/xml:xml-tests -c opt

      - name: Package
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          binaries = Path('bazel-bin/libs/python35')
          packages = {
              'xmltest': [Path('bazel-bin/cmd/xmltest/xmltest1800.exe')],
              'loader': [Path('third_party/Python35/bin/python35_ubi.dll'), *binaries.glob('*.dll')],
              'loader-dbg': list(binaries.glob('*.pdb')),
          }
          assert list(binaries.glob('*.dll')), 'Missing loader DLL'
          for name, files in packages.items():
              assert files, f'Missing files for {name}'
              with ZipFile(name + '.zip', 'w', ZIP_DEFLATED) as archive:
                  for file in files:
                      archive.write(file, file.name)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            xmltest.zip
            loader.zip
            loader-dbg.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Build
        run: |
          bazel --noworkspace_rc --bazelrc=.linux.bazelrc build //cmd/... //tests/... -c opt

      - name: Test
        run: bazel --noworkspace_rc --bazelrc=.linux.bazelrc test //tests/xml:xml-tests -c opt
