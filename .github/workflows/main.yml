name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Build
        run: |
          bazel build //... -c opt

      - name: Test
        run: bazel test //tests/xml/... -c opt --test_output=errors

      - name: Package
        run: python release/package.py --binary bazel-bin/cmd/xmltest/xmltest117.exe

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            dist/xmltest.zip
            dist/xmltest.zip.sha256
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Build
        run: |
          bazel --noworkspace_rc --bazelrc=.linux.bazelrc build //cmd/... //tests/... -c opt

      - name: Test
        run: bazel --noworkspace_rc --bazelrc=.linux.bazelrc test //tests/xml/... -c opt --test_output=errors
