site_name: Anno Modloader Reference
site_url: https://jakobharder.github.io/anno-mod-loader
copyright: Anno is a trademark of Ubisoft Entertainment in the US and/or other countries.
repo_url: https://github.com/jakobharder/anno-mod-loader
repo_name: anno-mod-loader

plugins:
  - search
  - macros

nav:
  - Home:
    - Overview: index.md
    - Anno 117 Changes: changes-117.md
  - Create Mods:
    - General:
      - File Structure: file-structure.md
      - Modinfo: modinfo.md
      - Loading Order: loading-order.md
    - XML Patches:
      - Get Started: modops/index.md
      - Basic Types: modops/basics.md
      - Groups and Conditions: modops/control.md
      - Dynamic Content: modops/content.md
      - Item Lists: modops/lists.md
    - Other Patches:
      - InfoTips: infotips.md
      - "CFG, FC Files": cfg-fc-patches.md
    - Options: options.md
    - Lua Scripts: lua-scripts.md
  - Use Mods:
    - Install Mods: install.md
    - Debug Mods: debug.md
    - Mod Profiles: profiles.md
  - External:
    - XPath Cheat Sheet: https://devhints.io/xpath

theme:
  name: material
  logo: images/logo.svg
  favicon: images/logo.png
  palette:
  # Palette toggle for automatic mode
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/link
      name: Switch to light mode

  # Palette toggle for light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: blue grey
    toggle:
      icon: material/toggle-switch
      name: Switch to dark mode

  # Palette toggle for dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: blue grey
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to system preference
  features:
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - header.autohide
    - navigation.footer
    - navigation.sections
    # - navigation.tabs
    # - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
      dedent_subsections: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - tables
  - toc:
      permalink: true
      toc_depth: 2

extra_css:
  - stylesheets/extra.css

extra:
  all: '<span class="version-tag" title="Available in all supported Annos">:material-animation-outline: 117 & 1800</span>'
  a1800: '<span class="version-tag" title="Only available in Anno 1800">:material-factory: 1800</span>'
  a117: '<span class="version-tag" title="Only available in Anno 117">:material-pillar: 117</span>'
  annotate:
    xml:  [.na, .s, .s2]