site_name: Anno Modloader Reference
site_url: https://jakobharder.github.io/anno-mod-loader

plugins:
  - search

nav:
  - Overview: index.md
  #- "Changes in 117":
  - Important Changes: changes-117.md
  - New Features: new-features-117.md
  - Features:
    - ModOps:
      - modops/index.md
      - Basic: modops/basics.md
      - Merge: modops/merge.md
      - Grouping: modops/groups.md
      - Conditions: modops/conditions.md
      - Examples: modops/examples.md
    - Options: options.md
    - InfoTips: infotips.md
  - XPath:
    - Cheat Sheet: https://devhints.io/xpath

theme:
  name: material
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: indigo
    accent: indigo
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - content.code.copy
    - navigation.footer
    - header.autohide
    - navigation.indexes
    # - navigation.tabs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes
  - attr_list
  - md_in_html