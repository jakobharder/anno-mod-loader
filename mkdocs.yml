site_name: Anno Mod Loader Reference
site_url: https://jakobharder.github.io/anno-mod-loader

plugins:
  - search

nav:
  - "Changes in 117":
    - Important Changes: index.md
    - New Features: new-features-117.md
  - ModOps:
    - Intro: modop-intro.md
    - Basic: basic-modops.md
    - Merge: merge.md
    - Grouping: groups.md
    - Conditions: conditions.md
    - Examples: modop-examples.md
  - XPath:
    - Cheat Sheet: https://devhints.io/xpath
  - Features:
    - Options: options.md
    - InfoTips: infotips.md

theme:
  name: material
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: indigo
    accent: indigo
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes