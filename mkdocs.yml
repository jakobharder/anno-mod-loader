site_name: Anno Mod Loader
site_url: https://jakobharder.github.io/anno-mod-loader

plugins:
  - search

nav:
  - "Changes in 117":
    - Important Changes: index.md
    - New Features: new-features-117.md
  - Features:
    - Conditions: conditions.md
    - "Options": options.md

theme:
  name: material
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: indigo
    accent: indigo
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.sections

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes