site_name: Anno Modloader Reference
site_url: https://jakobharder.github.io/anno-mod-loader

plugins:
  - search
  - macros

nav:
  - Overview: index.md
  #- "Changes in 117":
  - Important Changes: changes-117.md
  - New Features: new-features-117.md
  - Create Mods:
    - File Structure: file-structure.md
    - Modinfo: modinfo.md
    - Loading Order: loading-order.md
    - XML Patches:
      - modops/index.md
      - Basic Types: modops/basics.md
      - Groups and Conditions: modops/control.md
      - Dynamic Content: modops/content.md
      - Item Lists: modops/lists.md
    - Other Patches:
      - InfoTips: infotips.md
      - "CFG, FC Files": cfg-fc-patches.md
    - Options: options.md
    - Lua Scripts: lua-scripts.md
  - Use Mods:
    - Install Mods: install.md
    - Mod Profiles: profiles.md
  - External:
    - XPath Cheat Sheet: https://devhints.io/xpath

theme:
  name: material
  palette:
  # Palette toggle for automatic mode
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/link
      name: Switch to light mode

  # Palette toggle for light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: blue grey
    toggle:
      icon: material/toggle-switch
      name: Switch to dark mode

  # Palette toggle for dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: blue grey
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to system preference
  features:
    - navigation.sections
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - header.autohide
    - navigation.indexes
    # - navigation.tabs

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
    all: '<span class="version-tag" title="Available in all supported Annos">:material-animation-outline: 117 & 1800</span>'
    a1800: '<span class="version-tag" title="Only available in Anno 1800">:material-factory: 1800</span>'
    a117: '<span class="version-tag" title="Only available in Anno 117">:material-pillar: 117</span>'
    a117r: '<span class="version-tag" title="Only available in Anno 117">:material-pillar: 117 (not in demo)</span>'