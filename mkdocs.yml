site_name: Anno Mod Loader
site_url: https://jakobharder.github.io/anno-mod-loader

plugins:
  - search

nav:
  - Changes: index.md
  - New Features: new-features-117.md

theme:
  name: material
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: indigo
    accent: indigo
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: indigo
    accent: indigo

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes